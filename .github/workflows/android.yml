name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Each stage is its own step so a failure names the stage that broke, and
      # the key error lines are re-emitted as ::error:: annotations, which stay
      # readable without downloading the full log.
      - name: Ktlint
        run: |
          set -o pipefail
          ./gradlew ktlintCheck 2>&1 | tee /tmp/stage.log || {
            grep -E "^e: |error:|\.kt:[0-9]+|FAILURE:|What went wrong|^> " /tmp/stage.log \
              | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest 2>&1 | tee /tmp/stage.log || {
            grep -E "^e: |error:|\.kt:[0-9]+|FAILURE:|What went wrong|^> |Test.*FAILED" /tmp/stage.log \
              | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Android lint
        run: |
          set -o pipefail
          ./gradlew lintDebug 2>&1 | tee /tmp/stage.log || {
            grep -E "^e: |Error:|error:|FAILURE:|What went wrong|^> " /tmp/stage.log \
              | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Debug build
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee /tmp/stage.log || {
            grep -E "^e: |error:|\.kt:[0-9]+|FAILURE:|What went wrong|^> " /tmp/stage.log \
              | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
