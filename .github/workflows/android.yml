name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Split into separate steps so a failure names the stage that broke.
      - name: Ktlint
        run: ./gradlew ktlintCheck --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Debug build
        run: ./gradlew assembleDebug --stacktrace

      - name: Print failure reports
        if: failure()
        run: |
          echo "===== Lint (text report) ====="
          cat app/build/reports/lint-results-debug.txt 2>/dev/null | head -120 || echo "(none)"
          echo
          echo "===== Failing unit tests ====="
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            grep -q "<failure\|<error" "$f" && { echo "--- $f"; sed -n '1,120p' "$f"; }
          done || echo "(none)"

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
