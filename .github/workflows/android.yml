name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Each stage is its own step so a failure names the stage that broke, and
      # the key error lines are re-emitted as ::error:: annotations, which stay
      # readable without downloading the full log.
      - name: Ktlint
        run: |
          set -o pipefail
          ./gradlew ktlintCheck 2>&1 | tee /tmp/stage.log || {
            grep -vE "^> Task|^Download|^\s*$" /tmp/stage.log | tail -45 \
              | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest 2>&1 | tee /tmp/stage.log || {
            grep -vE "^> Task|^Download|^\\s*$" /tmp/stage.log | tail -45 \
              | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Android lint
        run: |
          set -o pipefail
          ./gradlew lintDebug 2>&1 | tee /tmp/stage.log || {
            grep -vE "^> Task|^Download|^\\s*$" /tmp/stage.log | tail -45 \
              | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Debug build
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee /tmp/stage.log || {
            grep -vE "^> Task|^Download|^\s*$" /tmp/stage.log | tail -45 \
              | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore

  # Runs on an emulator, so it is a separate job: slower than the checks above
  # and the only place the Room DAOs and the v2 -> v3 migration actually execute.
  instrumented:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The emulator needs hardware acceleration to be usable on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Room DAO and migration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/**
          if-no-files-found: ignore
